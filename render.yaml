services:
  - type: web
    name: aero-radar
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aero-radar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: SKYLINK_API_KEY
        sync: false
      - key: AIRCRAFT_DB_API_KEY
        sync: false
      - key: JETAPI_URL
        value: https://www.jetapi.dev/api

databases:
  - name: aero-radar-db
    plan: free
    region: virginia
